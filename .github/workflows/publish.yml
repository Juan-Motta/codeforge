name: Publish to npm (manual)

# Manually publish a tagged version of @jualopezmo/codeforge to npm.
#
# Trigger: workflow_dispatch only — nothing is published automatically. You choose the tag.
# Auth:    OIDC trusted publishing — NO stored npm token. GitHub Actions authenticates with a
#          short-lived OIDC credential, works with 2FA on the account, and (public repo) npm
#          generates provenance automatically.
#
# One-time setup on npmjs.com (Settings → Trusted Publisher → GitHub Actions):
#   Organization/user: Juan-Motta   Repository: codeforge
#   Workflow filename: publish.yml  Allowed action: npm publish
#
# THREE HARD RULES, asserted by tools/test/publish-workflow.test.mjs:
#
#  1. NO `${{ }}` INSIDE A `run:` SCRIPT. Actions substitutes expressions textually BEFORE the shell
#     parses them, so a workflow_dispatch input used in a run: script is a shell-injection sink.
#     Inputs reach the shell through `env:` only.
#  2. THE CREDENTIAL IS ISOLATED. `id-token: write` is granted to the `publish` job ONLY, and that
#     job runs no project code — no `npm ci`, no tests, no dependency lifecycle scripts. The gate
#     runs in a separate job with `contents: read` only. Otherwise a malicious dependency
#     `preinstall`, or a tampered test, could request the OIDC token and publish before the checks
#     it was supposed to pass.
#  3. THE TAG IS A TAG, AND IT IS GATED. Checkout uses `refs/tags/<tag>` so a branch that merely
#     shares the name cannot be published, and the input is matched against an anchored semver
#     pattern. The full suite runs on that tag before publishing: "CI was green on main at some
#     point" is not evidence that THIS tag passes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.5.1). Must already exist.'
        required: true
        type: string

# Least privilege by default; the publish job widens its own permissions below.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # gate: runs project code. Deliberately has NO id-token, so nothing it executes
  # can mint a publish credential.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate the tag (full suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `ref` is an action input, not shell source text. `refs/tags/` makes the ref
      # unambiguous — a branch named `v0.6.0` cannot satisfy it.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      # Node 20 = the `engines.node` floor and what ci.yml validates, so the gate exercises the
      # oldest runtime the package claims to support.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint skills (structural + codeforge rules)
        run: node tools/lint-skills.mjs
      - name: Routing / collision evals
        run: node tools/run-evals.mjs
      - name: Tool unit tests
        env:
          E2E_BROWSER_REQUIRED: '1'   # fail rather than skip the browser journeys
        run: node --test
      - name: Installer smoke (bash + npx)
        run: bash tests/smoke.sh

  # ---------------------------------------------------------------------------
  # publish: holds the OIDC credential. Runs no project code — checkout, a version
  # cross-check, and `npm publish`. Nothing here installs dependencies.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: mints the OIDC token npm trusts
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      # Node 24: npm trusted publishing requires a recent Node/npm pair. The `engines.node` floor is
      # covered by the gate job above, not by the runtime that uploads the tarball.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1. Pinned to the major rather than `@latest`, so the
      # publish chain does not silently take whatever npm shipped that day.
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@11

      - name: Verify tag shape and that it matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Anchored, not a glob: a `case` pattern like v[0-9]*.[0-9]*.[0-9]* also accepts
          # `v1x.2y.3z` and `v1.2.3-rc`, which are not releases of this package.
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::input tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"; exit 1; }
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${pkg}" ]; then
            echo "::error::input tag '${TAG}' does not match package.json version 'v${pkg}'"
            exit 1
          fi
          echo "publishing ${pkg} from ${TAG}"

      - name: Publish to npm (OIDC, provenance auto)
        run: npm publish --access public
